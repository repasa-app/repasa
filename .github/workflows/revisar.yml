# Revisión automática de cada cambio (y de cada pull request): si algo falla, se ve antes de que llegue a alguien.
# - comun: sintaxis, privacidad básica, pruebas de Python (con una IA falsa), del motor JS (que dé lo mismo que Python), contrato del
#   puente y de la interfaz (español/inglés, celular, contraste, misma lógica que Python), también con el anfitrión del teléfono.
#   Los proyectos nativos de movil/ (Xcode y Gradle) no se compilan aquí todavía.
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  comun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Sintaxis
        run: |
          node --check ui/app.js
          for f in motor/*.js movil/host/*.js movil/*.mjs pruebas/*.mjs pruebas/capacitor_falso.js; do node --check "$f"; done
          python3 -m py_compile bin/*.py pruebas/*.py
          python3 -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('ui/idiomas/*.json') + glob.glob('temas/*.json') + ['ui/demo.json', 'pruebas/casos.json']]"
          for f in herramientas/*.sh pruebas/*.sh; do bash -n "$f"; done
      - name: Privacidad (correos personales y rutas de usuario)
        run: bash herramientas/revisar_privacidad.sh --generico
      - name: Temas incluidos válidos
        run: |
          python3 - <<'PY'
          import sys, json, glob
          sys.path.insert(0, "bin"); import temas
          malos = {f: temas.validar(json.load(open(f, encoding="utf-8"))) for f in glob.glob("temas/*.json")}
          malos = {f: p for f, p in malos.items() if p}
          print(malos or "✓ Temas válidos"); sys.exit(1 if malos else 0)
          PY
      - name: Pruebas de Python
        run: python3 pruebas/test_python.py
      - name: Pruebas del motor JS (lo mismo que Python, cifrado, copia)
        run: node pruebas/motor.mjs
      - name: Contrato del puente (interfaz, celular y plugins nativos)
        run: python3 pruebas/contrato.py
      - name: Pruebas de la interfaz
        run: |
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p capturas
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" CAPTURAS=capturas node pruebas/interfaz.mjs
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" MOVIL=1 node pruebas/interfaz.mjs
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node pruebas/movil.mjs
      - name: "Celular: dependencias exactas, auditoría y cap sync"
        # npm ci instala solo lo de package-lock.json; movil/.npmrc deja fuera los scripts de instalación.
        working-directory: movil
        run: |
          npm ci
          npm audit --audit-level=high
          npx cap telemetry off
          npx cap sync
      - name: Capturas para revisar a ojo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: capturas, path: capturas, retention-days: 14, if-no-files-found: ignore }
